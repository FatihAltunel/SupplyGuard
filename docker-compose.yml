services:
  postgres:
    image: postgres:16
    container_name: supplyguard-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-supplyguard}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an ignored .env file}"
      POSTGRES_DB: "${POSTGRES_DB:-supplyguard_db}"
    ports:
      - "5433:5432"
    volumes:
      - supplyguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: supplyguard-redis
    ports:
      - "6379:6379"
    volumes:
      - supplyguard_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  supplyguard_postgres_data:
  supplyguard_redis_data:
